name: CI

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']          # 推送 v1.2.3 形式的标签 → 构建并发布 Release
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Go 测试（业务层、存储、调度、加密、HLC）
        run: go test ./...
      - name: 交叉编译检查 Windows 外壳
        run: |
          mkdir -p frontend/dist && [ -f frontend/dist/index.html ] || echo '<!doctype html>' > frontend/dist/index.html
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: 前端类型检查、单元测试、构建
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: 端到端测试（Playwright + Go 开发服务器）
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 安装 Wails 与 NSIS
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          choco install nsis -y --no-progress
      - name: 构建
        shell: bash
        run: |
          VERSION="1.0.0"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          wails build -clean -skipbindings -platform windows/amd64 -ldflags "-s -w -X main.version=${VERSION}"
          "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION=${VERSION} installer/deskpin.nsi
          mkdir -p build/portable
          cp build/bin/DeskPinMemo.exe build/portable/
          touch build/portable/portable.flag
          cp installer/portable-readme.txt build/portable/使用说明.txt
          (cd build/portable && 7z a -tzip ../bin/DeskPinMemo-${VERSION}-portable.zip .)
          ls -la build/bin
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPinMemo-windows
          path: |
            build/bin/*-setup.exe
            build/bin/*-portable.zip

  release:
    # 只在推送 v* 标签时运行：把 Windows 构建产物发布为 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeskPinMemo-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*-portable.zip
          generate_release_notes: true
          body: |
            ## 下载
            * `DeskPinMemo-*-setup.exe` — 安装版（免管理员，装到 `%LOCALAPPDATA%\Programs`）
            * `DeskPinMemo-*-portable.zip` — 绿色版（**请完整解压**后运行；默认不向注册表写入任何内容）

            需要 Windows 10 / 11 x64 与 Microsoft Edge WebView2 运行时。Windows 实机行为（钉在桌面、窗口级透明度、鼠标穿透、通知）尚在验证中，遇到问题请附上 `logs\app.log`。
